[package]
name = "nauka-node"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Distributed storage engine that heals itself — Reed-Solomon erasure coding, config-free DHT discovery, a single binary"
homepage = "https://getnauka.com"
repository = "https://github.com/sifrah/nauka"

[[bin]]
name = "nauka"
path = "src/main.rs"

[dependencies]
nauka-erasure = { path = "../nauka-erasure" }
nauka-store = { path = "../nauka-store" }
nauka-transport = { path = "../nauka-transport" }
nauka-cluster = { path = "../nauka-cluster" }
nauka-raft = { path = "../nauka-raft" }
nauka-discovery = { path = "../nauka-discovery" }
nauka-crypto = { path = "../nauka-crypto" }
nauka-s3 = { path = "../nauka-s3" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["fs"] }
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
mime_guess = "2"
s3s = "0.14"
async-trait = "0.1"
md-5 = "0.10"
data-encoding = "2"
time = "0.3"
percent-encoding = "2"
futures = "0.3"
hyper-util = { version = "0.1", features = ["server", "tokio"] }
hyper = { version = "1", features = ["server", "http1"] }
rand = "0.8"
flate2 = "1"
tar = "0.4"
sha2 = "0.10"
hmac = "0.12"
anyhow.workspace = true
axum = "0.8"
blake3.workspace = true
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-stream = "0.1"
tracing.workspace = true
tracing-subscriber.workspace = true

# ── Debian package (cargo-deb) ────────────────────────────────────────────
[package.metadata.deb]
name = "nauka"
maintainer = "Nauka contributors"
copyright = "Nauka contributors, AGPL-3.0"
license-file = ["../../LICENSE", "0"]
extended-description = """
Nauka splits every file into Reed-Solomon shards scattered across the nodes \
of a cluster and repairs itself continuously. Nodes find each other on the \
BitTorrent DHT with no configuration."""
section = "utils"
priority = "optional"
assets = [
    ["../../target/release/nauka", "usr/bin/", "755"],
    ["../../packaging/nauka.env.example", "usr/share/doc/nauka/", "644"],
    ["../../README.md", "usr/share/doc/nauka/", "644"],
]
maintainer-scripts = "../../packaging/deb"
systemd-units = { unit-name = "nauka", unit-scripts = "../../packaging", enable = false, start = false }

# ── RPM package (cargo-generate-rpm) ──────────────────────────────────────
[package.metadata.generate-rpm]
name = "nauka"
license = "AGPL-3.0"
summary = "Distributed storage engine that heals itself"
assets = [
    { source = "../../target/release/nauka", dest = "/usr/bin/nauka", mode = "755" },
    { source = "../../packaging/nauka.service", dest = "/usr/lib/systemd/system/nauka.service", mode = "644" },
    { source = "../../packaging/nauka.env.example", dest = "/usr/share/doc/nauka/nauka.env.example", mode = "644" },
    { source = "../../README.md", dest = "/usr/share/doc/nauka/README.md", mode = "644" },
    { source = "../../LICENSE", dest = "/usr/share/licenses/nauka/LICENSE", mode = "644" },
]
