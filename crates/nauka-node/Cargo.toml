[package]
name = "nauka-node"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "nauka"
path = "src/main.rs"

[dependencies]
nauka-erasure = { path = "../nauka-erasure" }
nauka-store = { path = "../nauka-store" }
nauka-transport = { path = "../nauka-transport" }
nauka-cluster = { path = "../nauka-cluster" }
nauka-raft = { path = "../nauka-raft" }
nauka-discovery = { path = "../nauka-discovery" }
nauka-crypto = { path = "../nauka-crypto" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["fs"] }
anyhow.workspace = true
axum = "0.8"
blake3.workspace = true
bytes = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-stream = "0.1"
tracing.workspace = true
tracing-subscriber.workspace = true
