[package]
name = "nauka-node"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Distributed storage engine that heals itself — Reed-Solomon erasure coding, a single binary"
homepage = "https://getnauka.com"
repository = "https://github.com/sifrah/nauka"

[[bin]]
name = "nauka"
path = "src/main.rs"

[features]
# The S3-compatible endpoint (SigV4, multipart, SSE-C, ~5000 lines) is not
# part of the core engine; it compiles only on demand. The replicated
# S3 state (buckets, credentials) stays unconditional — it is just data,
# and gating it would fork the wire format.
default = []
s3 = ["dep:s3s", "dep:md-5", "dep:data-encoding", "dep:percent-encoding", "dep:hmac"]

[dependencies]
nauka-erasure = { path = "../nauka-erasure" }
nauka-store = { path = "../nauka-store" }
nauka-transport = { path = "../nauka-transport" }
nauka-cluster = { path = "../nauka-cluster" }
nauka-raft = { path = "../nauka-raft" }
nauka-crypto = { path = "../nauka-crypto" }
nauka-s3 = { path = "../nauka-s3" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
tokio-util = { version = "0.7", features = ["io"] }
s3s = { version = "0.14", optional = true }
async-trait = "0.1"
md-5 = { version = "0.10", optional = true }
data-encoding = { version = "2", optional = true }
time = "0.3"
percent-encoding = { version = "2", optional = true }
futures = "0.3"
hyper-util = { version = "0.1", features = ["server", "tokio"] }
hyper = { version = "1", features = ["server", "http1"] }
rand = "0.8"
flate2 = "1"
tar = "0.4"
sha2 = "0.10"
hex = "0.4"
# Provisioning UI: animated steps and byte-progress on a tty, silent
# fallback to plain lines otherwise. console is what indicatif itself
# renders with; depending on it directly keeps one styling vocabulary.
indicatif = "0.17"
console = "0.15"
hmac = { version = "0.12", optional = true }
anyhow.workspace = true
axum = "0.8"
blake3.workspace = true
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
metrics.workspace = true
# default-features would pull http-listener and push-gateway (hyper-rustls,
# aws-lc-rs, prost) to run a second HTTP server. We render from our own axum
# route instead, so none of that is needed.
metrics-exporter-prometheus = { version = "0.18", default-features = false }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-stream = "0.1"
tracing.workspace = true
tracing-subscriber.workspace = true

# ── Debian package (cargo-deb) ────────────────────────────────────────────
[package.metadata.deb]
name = "nauka"
maintainer = "Nauka contributors"
copyright = "Nauka contributors, AGPL-3.0"
license-file = ["../../LICENSE", "0"]
extended-description = """
Nauka splits every file into Reed-Solomon shards scattered across the nodes \
of a cluster and repairs itself continuously. Membership is explicit: the \
first node founds the cluster, `nauka node add` grows it."""
section = "utils"
priority = "optional"
assets = [
    ["../../target/release/nauka", "usr/bin/", "755"],
    ["../../packaging/nauka.env.example", "usr/share/doc/nauka/", "644"],
    ["../../README.md", "usr/share/doc/nauka/", "644"],
]
maintainer-scripts = "../../packaging/deb"
systemd-units = { unit-name = "nauka", unit-scripts = "../../packaging", enable = false, start = false }

# ── RPM package (cargo-generate-rpm) ──────────────────────────────────────
[package.metadata.generate-rpm]
name = "nauka"
license = "AGPL-3.0"
summary = "Distributed storage engine that heals itself"
assets = [
    { source = "../../target/release/nauka", dest = "/usr/bin/nauka", mode = "755" },
    { source = "../../packaging/nauka.service", dest = "/usr/lib/systemd/system/nauka.service", mode = "644" },
    { source = "../../packaging/nauka.env.example", dest = "/usr/share/doc/nauka/nauka.env.example", mode = "644" },
    { source = "../../README.md", dest = "/usr/share/doc/nauka/README.md", mode = "644" },
    { source = "../../LICENSE", dest = "/usr/share/licenses/nauka/LICENSE", mode = "644" },
]
