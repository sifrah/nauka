[workspace]
resolver = "2"
members = [
    "crates/nauka-erasure",
    "crates/nauka-store",
    "crates/nauka-node",
    "crates/nauka-transport",
    "crates/nauka-cluster",
    "crates/nauka-raft",
    "crates/nauka-crypto",
    "crates/nauka-s3",
]

[workspace.package]
version = "0.6.10"
edition = "2021"
license = "AGPL-3.0-only"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Facade only: recording sites live in every crate, the recorder is installed
# once by nauka-node. Without one the macros compile to no-ops.
metrics = "0.24"
reed-solomon-erasure = { version = "6", features = ["simd-accel"] }

[patch.crates-io]
# Le crate amont 6.0.0 n'est plus maintenu et dépend encore de lru 0.7.8.
# Notre copie ne change aucun calcul Reed-Solomon ; elle remplace seulement
# ce cache par lru 0.18.2, qui corrige RUSTSEC-2026-0253.
reed-solomon-erasure = { path = "vendor/reed-solomon-erasure" }
