[workspace]
resolver = "2"
members = [
    "crates/yog-erasure",
    "crates/yog-store",
    "crates/yog-node",
    "crates/yog-transport",
    "crates/yog-cluster",
    "crates/yog-raft",
    "crates/yog-discovery",
    "crates/yog-crypto",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reed-solomon-erasure = { version = "6", features = ["simd-accel"] }
