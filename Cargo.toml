[workspace]
resolver = "2"
members = [
    "crates/nauka-erasure",
    "crates/nauka-store",
    "crates/nauka-node",
    "crates/nauka-transport",
    "crates/nauka-cluster",
    "crates/nauka-raft",
    "crates/nauka-crypto",
    "crates/nauka-s3",
]

[workspace.package]
version = "0.6.4"
edition = "2021"
license = "AGPL-3.0-only"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Facade only: recording sites live in every crate, the recorder is installed
# once by nauka-node. Without one the macros compile to no-ops.
metrics = "0.24"
reed-solomon-erasure = { version = "6", features = ["simd-accel"] }
