name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    permissions:
      contents: read
      id-token: write # provenance attestations
      attestations: write
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04 # oldest glibc we support
            packages: true
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            packages: true
          # Cross-compiled from Apple Silicon: Xcode ships both SDKs, and the
          # free Intel runners are being retired and queue for a long time.
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: aarch64-apple-darwin
            runner: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p nauka-node

      - name: Package tarball
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="nauka-${version}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/nauka" "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          cp packaging/nauka.service packaging/nauka.env.example "dist/$name/" 2>/dev/null || true
          tar -C dist -czf "dist/${name}.tar.gz" "$name"
          rm -rf "dist/$name"

      - name: Build .deb and .rpm
        if: matrix.packages
        run: |
          cargo install cargo-deb cargo-generate-rpm --locked
          # Both tools read target/release from the manifest; the Linux jobs
          # build natively, so the target triple output is the same binary.
          mkdir -p target/release
          cp "target/${{ matrix.target }}/release/nauka" target/release/nauka
          cargo deb -p nauka-node --no-build --output dist/
          cargo generate-rpm -p crates/nauka-node --output dist/

      - name: Checksums
        shell: bash
        run: |
          cd dist
          for f in *; do
            [ -f "$f" ] && sha256sum "$f" >> "SHA256SUMS-${{ matrix.target }}.txt" 2>/dev/null \
              || shasum -a 256 "$f" >> "SHA256SUMS-${{ matrix.target }}.txt"
          done

      # Cryptographic proof that these artifacts were produced by this
      # workflow, from this commit — verifiable with
      # `gh attestation verify <file> --repo sifrah/nauka`. Checksums alone
      # live next to the binaries they describe and so prove nothing against
      # a compromised release.
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Collect
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          cat dist/SHA256SUMS-*.txt > dist/SHA256SUMS.txt
          rm -f dist/SHA256SUMS-*.txt
          ls -la dist

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
