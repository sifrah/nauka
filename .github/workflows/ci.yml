name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Fail the build on warnings so lint debt cannot accumulate silently.
  RUSTFLAGS: -D warnings

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # rkyv n'est qu'une dépendance optionnelle inactive de rust_decimal.
      # `cargo tree --target all -i rkyv` est vide ; aucun binaire Nauka ne la
      # compile. La seule alerte exécutable (lru) est, elle, réellement corrigée.
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ignore: RUSTSEC-2026-0235

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.os }}

      - name: Build
        run: cargo build --workspace --all-targets --locked

      # The suite includes integration tests that spin up real QUIC clusters on
      # loopback, kill nodes, corrupt shards and run an in-process DHT testnet.
      # They bind ephemeral ports and need no outside network.
      - name: Test
        run: cargo test --workspace --locked
        timeout-minutes: 20

      # The s3 feature is off by default; build and test it explicitly so
      # the gated code cannot rot unnoticed.
      - name: Test (s3 feature)
        run: cargo test -p nauka-node --features s3 --locked
        timeout-minutes: 20

  lint:
    name: Format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: lint

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy (s3 feature)
        run: cargo clippy -p nauka-node --all-targets --features s3 --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked
