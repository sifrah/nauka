name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Fail the build on warnings so lint debt cannot accumulate silently.
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Build
        run: cargo build --workspace --all-targets --locked

      # The suite includes integration tests that spin up real QUIC clusters on
      # loopback, kill nodes, corrupt shards and run an in-process DHT testnet.
      # They bind ephemeral ports and need no outside network.
      - name: Test
        run: cargo test --workspace --locked
        timeout-minutes: 20

      # The s3 feature is off by default; build and test it explicitly so
      # the gated code cannot rot unnoticed.
      - name: Test (s3 feature)
        run: cargo test -p nauka-node --features s3 --locked
        timeout-minutes: 20

  lint:
    name: Format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: lint

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy (s3 feature)
        run: cargo clippy -p nauka-node --all-targets --features s3 --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked

